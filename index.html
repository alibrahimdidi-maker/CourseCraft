    <!-- ===================================================================================
         RASFAHI FIX (26 Sep 2026)
         1. Dashboard: clicking a lecturer's module opens their outline (finds it even if the
            task points to an old course id; clear message if it never reached the cloud).
         2. Lecturers' outlines that were saved only on their own computer are pushed to the
            cloud automatically the next time they open RASFAHI.
         3. Full Program Document: Preview / PDF / Word work again, and no longer overwrite the
            active module with the last module's content.
         Paste this whole block just ABOVE the closing </body> tag (after the main <script>).
         =================================================================================== -->
    <script>
    (function () {
        // Snapshot of every browser backup taken at page load, BEFORE any autosave can overwrite it.
        var __localSnapshot = {};
        try {
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf('rasfahi_archive_') === 0) __localSnapshot[k] = localStorage.getItem(k);
            }
        } catch (e) {}
        window.__rfLocalSnapshot = __localSnapshot;
    })();

    // ---------- 1. Open a lecturer's outline from the Dashboard / lists ----------
    function locateOutline(uid, cId, mId, code) {
        var col = db.collection('rasfahi_users').doc(uid).collection('courses');
        return col.get({ source: 'server' }).catch(function () { return col.get(); }).then(function (snap) {
            var found = null;
            snap.forEach(function (d) { var m = (d.data() || {}).modules || {}; if (!found && d.id === cId && m[mId]) found = { cId: d.id, mId: mId }; });
            if (!found) snap.forEach(function (d) { var m = (d.data() || {}).modules || {}; if (!found && m[mId]) found = { cId: d.id, mId: mId }; });
            if (!found && code) {
                var want = dupKey(code);
                snap.forEach(function (d) {
                    var m = (d.data() || {}).modules || {};
                    Object.keys(m).forEach(function (id) { if (!found && dupKey(m[id].code) === want) found = { cId: d.id, mId: id }; });
                });
            }
            return { found: found, count: snap.size };
        });
    }

    function openOutlineFor(uid, cId, mId) {
        var t = taskByModule(uid, mId) || Object.values(assignmentsMap).find(function (a) { return a.lecturerUid === uid && a.courseId === cId; }) || null;
        var mode = taskOpenMode(t);
        if (!mode) {
            alert(t && t.stage === 'approved'
                ? "This outline is approved by MQA. It will open (view only) once the Curriculum Department attaches the certificate and releases the course to the faculty."
                : "This outline is with the Curriculum Department / MQA. The faculty can follow its progress, but it opens only after MQA approval and the certificate is released.");
            return;
        }
        forceReadOnly = (mode === 'view');
        var me = auth.currentUser ? auth.currentUser.uid : null;
        var goEditor = function () { switchStep(5, document.querySelectorAll('.nav-links li')[4]); };

        if (uid === me) {   // my own outline
            var openOwn = function () {
                var c = dbState.courses[cId];
                if (c && c.modules && c.modules[mId]) { loadStateFromMemory(cId, mId, true); goEditor(); }
                else alert("This outline was not found in your archive. Open My Tasks and press \"Start working\" (or \"Import from Word\") again.");
            };
            if (!isOwnWorkspace()) switchWorkspace(me).then(function () { setTimeout(openOwn, 800); }); else openOwn();
            return;
        }

        var statusEl = document.getElementById('sync-status-text');
        if (statusEl) statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Finding the outline...';
        locateOutline(uid, cId, mId, t && t.moduleCode).then(function (r) {
            if (statusEl) statusEl.innerHTML = 'Ready';
            if (!r.found) {
                var who = (t && (t.lecturerName || t.lecturerEmail)) || (findAccount(uid).name || findAccount(uid).email || 'the lecturer');
                var what = t ? (t.moduleCode + ' - ' + t.moduleName) : 'this module';
                alert("⚠️ The outline \"" + what + "\" of " + who + " has not reached the Cloud Archive yet" + (r.count ? "" : " (their cloud archive is empty)") + ".\n\n" +
                      "It is most likely saved only in the browser of the computer they worked on.\n\n" +
                      "Please ask " + who + " to open RASFAHI on that same computer and browser, with the same account. " +
                      "It will now be sent to the cloud automatically - or they can open the outline and press \"Cloud Save\". " +
                      "The bottom of their sidebar must say \"Saved to Cloud\". Then open it here again.");
                return;
            }
            // The task pointed to an old place - repair the link so next time it opens directly.
            if (t && (t.courseId !== r.found.cId || t.moduleId !== r.found.mId) && can('allocate')) {
                db.collection('rasfahi_assignments').doc(t.id).update({ courseId: r.found.cId, moduleId: r.found.mId, updatedAt: nowIso() }).catch(function () {});
            }
            switchWorkspace(uid, findAccount(uid), r.found.cId, r.found.mId).then(function (ok) { if (ok) goEditor(); });
        }).catch(function (err) {
            if (statusEl) statusEl.innerHTML = 'Ready';
            alert("❌ Could not open this outline: " + (err.code || err.message) + "\nIf this says permission-denied, publish the Firestore rules from the Manage Users page.");
        });
    }

    // ---------- 2. Push lecturers' task outlines that never reached the cloud ----------
    var __healChecked = {};
    function healOwnTaskOutlines() {
        if (!auth.currentUser || !isOwnWorkspace() || !wsDocRef || !navigator.onLine) return;
        var me = auth.currentUser.uid;
        var local = null;
        try { local = JSON.parse((window.__rfLocalSnapshot || {})['rasfahi_archive_' + me] || localStorage.getItem('rasfahi_archive_' + me) || 'null'); } catch (e) {}
        var localCourses = (local && local.dbState && local.dbState.courses) || {};
        myAssignmentsList().forEach(function (a) {
            var id = a.courseId;
            if (!id || __healChecked[id]) return;
            __healChecked[id] = true;
            wsDocRef.collection('courses').doc(id).get({ source: 'server' }).then(function (doc) {
                if (doc.exists) return;                                     // already safe in the cloud
                var c = dbState.courses[id] || localCourses[id];
                if (!c) return;
                if (!dbState.courses[id]) dbState.courses[id] = c;
                dirtyCourses.add(id);
                pushDirtyCoursesToCloud(false);
                showToast('☁️ Your outline <b>' + esc(a.moduleCode) + '</b> was only on this computer - it has now been sent to the Cloud Archive.', true);
                if (isStepActive(10)) renderArchive();
            }).catch(function () { __healChecked[id] = false; });
        });
    }
    (function () {
        var orig = window.onAssignmentsChanged;
        window.onAssignmentsChanged = function (prev, next, first) {
            orig(prev, next, first);
            setTimeout(healOwnTaskOutlines, first ? 3500 : 500);
        };
    })();

    // ---------- 3. Full Program Document (Preview / PDF / Word) ----------
    function loadModuleForExport(cId, mId) {
        var mod = dbState.courses[cId].modules[mId] || {};
        var mData = mod.moduleData || {};
        ['tbody-matrix', 'tbody-sch', 'tbody-assess'].forEach(function (id) { document.getElementById(id).innerHTML = ''; });
        document.querySelectorAll('.mod-data').forEach(function (el) {
            if (el.hasAttribute('contenteditable')) { el.innerText = '0'; el.removeAttribute('data-manual'); }
            else if (el.type !== 'checkbox') el.value = '';
        });
        if (mData.matrixHtml) document.getElementById('tbody-matrix').innerHTML = mData.matrixHtml;
        if (mData.schHtml) document.getElementById('tbody-sch').innerHTML = mData.schHtml;
        if (mData.assessHtml) document.getElementById('tbody-assess').innerHTML = mData.assessHtml;
        Object.keys(mData.inputs || {}).forEach(function (id) {
            var el = document.getElementById(id), v = mData.inputs[id];
            if (!el) return;
            if (v && typeof v === 'object' && v.checkbox) el.checked = !!v.checked;
            else if (el.hasAttribute('contenteditable')) { el.innerText = (v && typeof v === 'object') ? v.value : v; if (v && typeof v === 'object' && v.manual) el.setAttribute('data-manual', v.manual); }
            else el.value = (v && typeof v === 'object') ? v.value : (v == null ? '' : v);
        });
        if (!document.getElementById('m-name-rtl').value && !document.getElementById('m-name-ltr').value) document.getElementById('m-name-rtl').value = mod.name || '';
        if (!document.getElementById('m-code').value) document.getElementById('m-code').value = mod.code || '';
        recalculateAllRows();
    }

    function buildFullProgramHTML() {
        if (!activeCourseId || !dbState.courses[activeCourseId]) throw new Error('NO_COURSE');
        saveCurrentToDB();
        var cId = activeCourseId, origMod = activeModuleId;
        var course = dbState.courses[cId];
        var html = buildProgramHTMLPartA_B();
        html += '<div class="export-wrapper"><div class="page-break"></div><h1>PART C: Module Outlines</h1></div>';
        var ids = Object.keys(course.modules || {});
        isProgrammaticChange = true;
        try {
            ids.forEach(function (mId) { loadModuleForExport(cId, mId); html += buildModuleHTML(); });
        } finally {
            loadStateFromMemory(cId, origMod, false);      // restore the screen WITHOUT saving over the active module
            recalculateAllRows(); calcF3Total(); applyLockState();
            isProgrammaticChange = false;
        }
        html += buildProgramHTMLPartD_Annex();
        return html;
    }

    function reportExportError(e) {
        console.error('[RASFAHI] export failed', e);
        if (e && e.message === 'NO_COURSE') alert("Please open a course first (Archive Bank, My Tasks or All Outlines), then export the Full Program Document.");
        else alert("❌ The document could not be built: " + (e && (e.message || e))); 
    }
    (function () {
        var origPreview = window.showPreview, origExport = window.exportDoc;
        window.showPreview = function (type) { try { origPreview(type); } catch (e) { reportExportError(e); } };
        window.exportDoc = function (type, format) {
            try { origExport(type, format); }
            catch (e) {
                var w = document.getElementById('export-render-wrapper');
                if (w) { w.style.left = '-10000px'; w.style.zIndex = '-1000'; }
                reportExportError(e);
            }
        };
    })();
    </script>
